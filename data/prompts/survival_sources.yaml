# Auto-discovered sources
auto_discovered:
  youtube_channels:
    # Top survival channels
    - channel: "Survival Lilly"
      category: "survival_skills"
      max_videos: 15

    - channel: "TA Outdoors"
      category: "bushcraft"
      max_videos: 15

    - channel: "MCQBushcraft"
      category: "bushcraft"
      max_videos: 10

    - channel: "Coalcracker Bushcraft"
      category: "bushcraft_skills"
      max_videos: 10

  websites:
    - url: "https://www.survivopedia.com/"
      title: "Survivopedia"
      category: "general_survival"

    - url: "https://www.artofmanliness.com/skills/outdoor-survival/"
      title: "Art of Manliness - Survival"
      category: "survival_skills"

  polish_sources:
    # Polskie źródła
    - url: "https://www.survival.org.pl/"
      title: "Survival.org.pl"
      category: "polish_survival"
      note: "Polish survival community"


